name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  # Redis 8's bundled modules require Rust; these tests use plain Redis.
  REDISMS_VERSION: '7.4.0'
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/dev' }}

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR destination
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$PR_BASE" == dev ]]; then exit 0; fi
          if [[ "$PR_BASE" == main && "$PR_HEAD" == dev && "$PR_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then exit 0; fi
          echo '::error::Contributions must target dev. Only the repository dev branch may be promoted to main.'
          exit 1
      - name: Validate workflow syntax
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12 -color -shellcheck=
      - uses: ./.github/actions/setup-ci
      - name: Check licensing boundaries and notices
        run: |
          node --test tools/ci/*.test.mjs
          node tools/ci/check-license-boundaries.mjs
      - name: Verify benchmark regression gate
        run: |
          npm run test-bench-gate
          node benchmark/gate/cli.mjs selftest

  checks:
    name: Checks (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [quality, unit, engine-integration, ce, ee, cloud, migrations, integrations]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Run checks
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          node tools/ci/run-check.mjs "$SUITE" 2>&1 | tee ci.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.suite }}-diagnostics
          path: |
            ci.log
            packages/core/shared/coverage
            packages/core/execution/coverage
            packages/engine/coverage
            packages/connect-sdk/coverage
            packages/web/coverage
            packages/server/api/coverage
            packages/server/api/junit.xml
          retention-days: 7
          if-no-files-found: warn

  tool-search-postgres:
    name: tool-search (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inboxfm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      AP_EDITION: ce
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: localhost
      AP_POSTGRES_PORT: '5432'
      AP_POSTGRES_DATABASE: inboxfm_test
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_PASSWORD: postgres
      AP_POSTGRES_USE_SSL: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Enable pgvector for integration tests
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d inboxfm_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Build API
        run: bun x turbo run build --filter=api
      - name: Run PostgreSQL driver tests
        working-directory: packages/server/api
        run: |
          set -o pipefail
          bun x vitest run test/integration/ce/tool-search test/integration/ce/database --bail 1 --passWithNoTests=false 2>&1 | tee postgres-tests.log
      - name: Upload PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-diagnostics
          path: packages/server/api/postgres-tests.log
          retention-days: 7
          if-no-files-found: warn

  main:
    name: main
    if: always()
    needs: [policy, checks, tool-search-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); const failed = Object.entries(jobs).filter(([, job]) => job.result !== "success"); if (failed.length) { console.error(failed.map(([name, job]) => name + ": " + job.result).join("\n")); process.exit(1); } console.log("All CI checks passed.");'
